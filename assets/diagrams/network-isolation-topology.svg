<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img"
     aria-labelledby="topo-title topo-desc" font-family="'IBM Plex Mono', ui-monospace, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="topo-title">망분리 환경별 Kubernetes 플랫폼 구성</title>
  <desc id="topo-desc">DMZ 구역에 운영·개발/스테이징·DR 세 개 환경, 내부 구역에 운영·개발/스테이징·DR·샌드박스 네 개 환경으로 총 7개의 격리 네트워크가 존재합니다. 환경마다 Supervisor Cluster 하나와 Shared·Workload 게스트 클러스터가 있으며, Jumpbox·DHCP·Harbor·MinIO·AVI Controller·Service Engine이 환경별로 따로 존재합니다. 전체 클러스터는 Supervisor 7개와 게스트 18개로 25개입니다.</desc>

  <style>
    .bg     { fill: var(--paper, #F1F3F2); }
    .zone   { font-size: 14px; font-weight: 600; fill: var(--ink-strong, #14181B); letter-spacing: .06em; }
    .env    { fill: var(--paper-raised, #FFFFFF); stroke: var(--rule, #CDD5D3); stroke-width: 1; }
    .env-p  { stroke: var(--signal, #0E5C4A); stroke-width: 1.6; }
    .env-s  { stroke: var(--flag, #7A4A12); stroke-width: 1.3; stroke-dasharray: 5 3; }
    .etitle { font-size: 12.5px; font-weight: 600; fill: var(--ink-strong, #14181B); }
    .sup    { font-size: 10.5px; font-weight: 600; fill: var(--ink-soft, #4C575D); }
    .cl     { font-size: 10.5px; fill: var(--ink, #14181B); }
    .num    { font-size: 10.5px; fill: var(--ink-soft, #4C575D); }
    .stack  { font-size: 9.5px; fill: var(--ink-faint, #78848A); }
    .head   { font-size: 14px; font-weight: 600; fill: var(--ink-strong, #14181B); }
    .cap    { font-size: 11px; fill: var(--ink-soft, #4C575D); }
    .faint  { font-size: 10.5px; fill: var(--ink-faint, #78848A); }
    .kpi    { font-size: 19px; font-weight: 600; fill: var(--signal, #0E5C4A); }
    .kpil   { font-size: 10px; fill: var(--ink-faint, #78848A); }
    .rule   { stroke: var(--rule, #CDD5D3); stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="610"/>

  <text class="head" x="32" y="28">망분리 환경별 Kubernetes 플랫폼 구성</text>
  <text class="cap"  x="32" y="47">7개 네트워크는 서로 통신하지 않습니다. 환경마다 같은 스택을 따로 세우고 따로 운영합니다.</text>
  <line class="rule" x1="32" y1="62" x2="928" y2="62"/>

  <text class="kpi"  x="32"  y="90">7</text>
  <text class="kpil" x="52"  y="90">격리 네트워크</text>
  <text class="kpi"  x="176" y="90">7</text>
  <text class="kpil" x="196" y="90">Supervisor Cluster</text>
  <text class="kpi"  x="352" y="90">18</text>
  <text class="kpil" x="382" y="90">게스트 클러스터 · Shared 9 / Workload 9</text>
  <text class="kpi"  x="690" y="90">25</text>
  <text class="kpil" x="720" y="90">총 클러스터</text>
  <text class="kpi"  x="812" y="90">66+</text>
  <text class="kpil" x="852" y="90">워커 노드</text>

  <text class="zone" x="32" y="126">DMZ</text>
  <text class="faint" x="76" y="126">외부 접점 · 전 게스트 클러스터 워커 3대 통일 · 합계 24대</text>

