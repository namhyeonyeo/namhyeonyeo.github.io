  <line class="rule" x1="46" y1="170" x2="306" y2="170"/>
  <text class="sup" x="46" y="188">Supervisor Cluster</text>
  <text class="cl"  x="46" y="210">PRD Shared Cluster</text>
  <text class="num" x="306" y="210" text-anchor="end">워커 3</text>
  <text class="cl"  x="46" y="228">PRD Workload Cluster</text>
  <text class="num" x="306" y="228" text-anchor="end">워커 3</text>
  <line class="rule" x1="46" y1="262" x2="306" y2="262"/>
  <text class="stack" x="46" y="278">Jumpbox · DHCP · Harbor · MinIO</text>
  <text class="stack" x="46" y="292">AVI Controller · Service Engine · AKO · Contour</text>

  <rect class="env" x="336" y="138" width="288" height="164" rx="3"/>
  <text class="etitle" x="350" y="160">개발 / 스테이징</text>
  <text class="faint"  x="610" y="160" text-anchor="end">같은 네트워크, 클러스터로 분리</text>
  <line class="rule" x1="350" y1="170" x2="610" y2="170"/>
  <text class="sup" x="350" y="188">Supervisor Cluster</text>
  <text class="cl"  x="350" y="210">STG Shared Cluster</text>
  <text class="num" x="610" y="210" text-anchor="end">워커 3</text>
