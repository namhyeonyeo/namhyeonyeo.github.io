  <text class="stack" x="654" y="278">Jumpbox · DHCP · Harbor · MinIO</text>
  <text class="stack" x="654" y="292">AVI Controller · Service Engine · AKO · Contour</text>

  <text class="zone" x="32" y="342">내부</text>
  <text class="faint" x="80" y="342">업무 구역 · Shared는 전 환경 3대 통일, Workload만 환경별 상이 · 합계 42대</text>

  <rect class="env env-p" x="32" y="354" width="212" height="182" rx="3"/>
  <text class="etitle" x="46" y="376">운영</text>
  <line class="rule" x1="46" y1="386" x2="230" y2="386"/>
  <text class="sup" x="46" y="404">Supervisor Cluster</text>
  <text class="cl"  x="46" y="426">PRD Shared</text>
  <text class="num" x="230" y="426" text-anchor="end">워커 3</text>
  <text class="cl"  x="46" y="444">PRD Workload</text>
  <text class="num" x="230" y="444" text-anchor="end">워커 6</text>
  <text class="faint" x="46" y="466">CI/CD · 공통 컴포넌트</text>
  <text class="faint" x="46" y="482">업무 워크로드</text>
  <line class="rule" x1="46" y1="496" x2="230" y2="496"/>
  <text class="stack" x="46" y="512">Jumpbox · DHCP · Harbor · MinIO</text>
  <text class="stack" x="46" y="526">AVI Controller · Service Engine</text>

  <rect class="env" x="256" y="354" width="212" height="182" rx="3"/>
  <text class="etitle" x="270" y="376">개발 / 스테이징</text>
  <line class="rule" x1="270" y1="386" x2="454" y2="386"/>
  <text class="sup" x="270" y="404">Supervisor Cluster</text>
  <text class="cl" x="270" y="426">STG Shared</text>
  <text class="num" x="454" y="426" text-anchor="end">워커 3</text>
  <text class="cl" x="270" y="444">STG Workload</text>
  <text class="num" x="454" y="444" text-anchor="end">워커 7</text>
  <text class="cl" x="270" y="462">DEV Shared</text>
  <text class="num" x="454" y="462" text-anchor="end">워커 3</text>
  <text class="cl" x="270" y="480">DEV Workload</text>
  <text class="num" x="454" y="480" text-anchor="end">워커 9</text>
  <line class="rule" x1="270" y1="496" x2="454" y2="496"/>
  <text class="stack" x="270" y="512">Jumpbox · DHCP · Harbor · MinIO</text>
  <text class="stack" x="270" y="526">AVI Controller · Service Engine</text>

  <rect class="env" x="480" y="354" width="212" height="182" rx="3"/>
  <text class="etitle" x="494" y="376">DR</text>
  <line class="rule" x1="494" y1="386" x2="678" y2="386"/>
