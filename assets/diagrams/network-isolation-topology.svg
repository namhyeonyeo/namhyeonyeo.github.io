  <text class="num" x="610" y="228" text-anchor="end">워커 3</text>
  <text class="cl"  x="350" y="246">DEV Shared Cluster</text>
  <text class="num" x="610" y="246" text-anchor="end">워커 3</text>
  <text class="cl"  x="350" y="264">DEV Workload Cluster</text>
  <text class="num" x="610" y="264" text-anchor="end">워커 3</text>
  <line class="rule" x1="350" y1="274" x2="610" y2="274"/>
  <text class="stack" x="350" y="290">Jumpbox · DHCP · Harbor · MinIO · AVI Controller · Service Engine</text>

  <rect class="env" x="640" y="138" width="288" height="164" rx="3"/>
  <text class="etitle" x="654" y="160">DR</text>
  <line class="rule" x1="654" y1="170" x2="914" y2="170"/>
  <text class="sup" x="654" y="188">Supervisor Cluster</text>
  <text class="cl"  x="654" y="210">PRD Shared Cluster</text>
  <text class="num" x="914" y="210" text-anchor="end">워커 3</text>
  <text class="cl"  x="654" y="228">PRD Workload Cluster</text>
