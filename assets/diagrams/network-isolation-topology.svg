  <line class="rule" x1="494" y1="496" x2="678" y2="496"/>
  <text class="stack" x="494" y="512">Jumpbox · DHCP · Harbor · MinIO</text>
  <text class="stack" x="494" y="526">AVI Controller · Service Engine</text>

  <rect class="env env-s" x="704" y="354" width="212" height="182" rx="3"/>
  <text class="etitle" x="718" y="376" fill="var(--flag, #7A4A12)">샌드박스</text>
  <line class="rule" x1="718" y1="386" x2="902" y2="386"/>
  <text class="sup" x="718" y="404">Supervisor Cluster</text>
  <text class="cl" x="718" y="426">Shared Cluster</text>
  <text class="num" x="902" y="426" text-anchor="end">워커 3</text>
  <text class="cl" x="718" y="444">Workload Cluster</text>
  <text class="faint" x="718" y="470">운영 반영 전 검증 전용</text>
  <line class="rule" x1="718" y1="496" x2="902" y2="496"/>
  <text class="stack" x="718" y="512">Jumpbox · DHCP · Harbor · MinIO</text>
  <text class="stack" x="718" y="526">AVI Controller · Service Engine</text>

  <line class="rule" x1="32" y1="558" x2="928" y2="558"/>
  <text class="faint" x="32" y="578">Shared 클러스터 9개는 전부 워커 3대로 통일했고, Workload만 환경 성격에 따라 3~9대로 다릅니다. Harbor · MinIO · DHCP · Jumpbox · AVI Controller는 환경마다 별도로 존재합니다.</text>
  <text class="faint" x="32" y="596">vSphere 8 · VMware VKS · Contour / Envoy · AKO / AVI (NSX ALB) · Harbor · MinIO — 고객사 네트워크 대역, 클러스터 이름, 도메인은 제거했습니다.</text>
</svg>
