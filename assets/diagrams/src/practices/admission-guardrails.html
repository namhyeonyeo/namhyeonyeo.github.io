<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admission Guardrails — VAP / CEL과 ResourceQuota</title>
<style>
  /* Standalone preview only. In the site these are defined in theme.css and the
     exported SVG inherits them, so the same file renders light, dark and print. */
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-accent-tint: rgba(15,118,110,.08);
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Admission Guardrails</p>
<h1>Admission 경로와 별도 제어 계층</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"
     aria-labelledby="admission-guardrails-title admission-guardrails-desc">
  <title id="admission-guardrails-title">Admission Guardrails — VAP/CEL 검증과 ResourceQuota</title>
  <desc id="admission-guardrails-desc">워크로드 생성·수정 요청은 policy-exclude=true 라벨이 붙은 Namespace면 평가에서 빠지고, 그렇지 않으면 ValidatingAdmissionPolicy가 CEL로 requests와 limits 정의 여부를 검증합니다. 위반은 Binding의 validationActions에 따라 컨테이너는 Deny, initContainer는 Warn으로 처리되며, ResourceQuota는 이 경로와 별개로 Namespace 총량을 봅니다.</desc>

  <defs>
    <marker id="ag-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
  </defs>

  <g font-family="'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif">

    <!-- separate control layer (zone drawn first) -->
    <rect x="136" y="424" width="368" height="112" rx="8" fill="var(--dg-accent-tint, rgba(15,118,110,.08))"
          stroke="var(--dg-accent, #0F766E)" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,4"/>
    <rect x="152" y="416" width="128" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="160" y="428" font-size="12" font-weight="500" fill="var(--dg-accent-text, #0B5651)">별도 제어 계층</text>

    <!-- arrows -->
    <line x1="320" y1="96" x2="320" y2="120" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
    <line x1="192" y1="164" x2="156" y2="164" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
    <line x1="320" y1="204" x2="320" y2="224" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
    <line x1="320" y1="292" x2="320" y2="312" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
    <line x1="464" y1="356" x2="556" y2="356" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
    <line x1="720" y1="324" x2="720" y2="264" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
    <line x1="720" y1="388" x2="720" y2="448" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
    <line x1="320" y1="396" x2="320" y2="444" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#ag-arrow)"/>

    <!-- arrow labels -->
    <rect x="160" y="140" width="32" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="176" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">YES</text>

    <rect x="332" y="212" width="32" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="332" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">NO</text>

    <rect x="476" y="332" width="72" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="512" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">VIOLATION</text>

    <rect x="732" y="288" width="80" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="732" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          fill="var(--dg-muted, #5B6879)">containers</text>

    <rect x="732" y="412" width="112" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="732" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          fill="var(--dg-muted, #5B6879)">initContainers</text>

    <rect x="332" y="408" width="40" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="332" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">PASS</text>

    <!-- request -->
    <rect x="208" y="40" width="224" height="56" rx="28" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="208" y="40" width="224" height="56" rx="28" fill="var(--dg-legacy-fill, #F1F5F9)" stroke="var(--dg-line, #94A3B8)" stroke-width="1"/>
    <text x="320" y="68" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">워크로드 요청</text>
    <text x="320" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">CREATE / UPDATE</text>

    <!-- exception decision -->
    <polygon points="320,124 448,164 320,204 192,164" fill="var(--dg-surface, #FFFFFF)"/>
    <polygon points="320,124 448,164 320,204 192,164" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="320" y="160" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Namespace 예외?</text>
    <text x="320" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">policy-exclude=true</text>

    <!-- excluded terminal -->
    <rect x="40" y="140" width="112" height="48" rx="24" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="40" y="140" width="112" height="48" rx="24" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="96" y="172" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">평가 제외</text>

    <!-- policy -->
    <rect x="176" y="228" width="288" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="176" y="228" width="288" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="320" y="260" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">ValidatingAdmissionPolicy</text>
    <text x="320" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">CEL matchConditions / validations</text>

    <!-- CEL decision -->
    <polygon points="320,316 464,356 320,396 176,356" fill="var(--dg-surface, #FFFFFF)"/>
    <polygon points="320,316 464,356 320,396 176,356" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="320" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">requests / limits</text>
    <text x="320" y="376" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">정의됨?</text>

    <!-- binding -->
    <rect x="560" y="324" width="256" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="560" y="324" width="256" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="688" y="356" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">VAP Binding</text>
    <text x="688" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">validationActions</text>

    <!-- deny -->
    <rect x="624" y="204" width="192" height="56" rx="28" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="624" y="204" width="192" height="56" rx="28" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1.2"/>
    <text x="720" y="228" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Deny</text>
    <text x="720" y="248" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-muted, #5B6879)">요청 거부</text>

    <!-- warn -->
    <rect x="624" y="452" width="192" height="56" rx="28" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="624" y="452" width="192" height="56" rx="28" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="720" y="476" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Warn</text>
    <text x="720" y="496" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-muted, #5B6879)">생성은 되고 경고만</text>

    <!-- resource quota: separate layer -->
    <rect x="160" y="448" width="320" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="160" y="448" width="320" height="64" rx="6" fill="var(--dg-accent-fill, #E6F2F1)" stroke="var(--dg-accent, #0F766E)" stroke-width="1.2"/>
    <text x="320" y="480" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-accent-text, #0B5651)">ResourceQuota</text>
    <text x="320" y="500" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-accent-text, #0B5651)">Namespace 총량 검사</text>

    <!-- legend -->
    <line x1="40" y1="552" x2="920" y2="552" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <text x="40" y="580" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">LEGEND</text>
    <rect x="136" y="572" width="32" height="16" rx="3" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="180" y="580" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">Admission 경로</text>
    <rect x="324" y="572" width="32" height="16" rx="3" fill="var(--dg-accent-fill, #E6F2F1)" stroke="var(--dg-accent, #0F766E)" stroke-width="1"/>
    <text x="368" y="580" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">매니페스트가 아니라 총량을 보는 계층</text>
  </g>
</svg>

<footer>diagram-design · profile namhyeonyeo-portfolio · sanitized public version</footer>
</div>
</body>
</html>
