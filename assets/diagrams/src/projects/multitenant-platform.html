<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>격리 네트워크 1개의 플랫폼 구성</title>
<style>
  /* Standalone preview only. In the site these are defined in theme.css and the
     exported SVG inherits them, so the same file renders light, dark and print. */
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-accent-tint: rgba(15,118,110,.08);
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Multi-Tenant Kubernetes Platform</p>
<h1>격리 네트워크 1개의 구성 — 그리고 그 반복</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"
     aria-labelledby="multitenant-platform-title multitenant-platform-desc">
  <title id="multitenant-platform-title">격리 네트워크 한 곳의 Kubernetes 플랫폼 구성</title>
  <desc id="multitenant-platform-desc">격리 네트워크 한 곳 안에 Supervisor 클러스터를 두고 그 아래 Shared와 Workload 게스트 클러스터를 운영하며, Ingress와 Registry, Storage를 환경마다 따로 둡니다. 환경 간 통신 경로가 없어 같은 구성이 7개 네트워크에 통째로 반복됩니다.</desc>

  <defs>
    <marker id="mp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
  </defs>

  <g font-family="'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif">

    <!-- repeated copies behind the front zone -->
    <rect x="72" y="48" width="616" height="384" rx="8" fill="var(--dg-surface, #FFFFFF)"
          stroke="var(--dg-legacy, #94A3B8)" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="56" y="60" width="616" height="384" rx="8" fill="var(--dg-surface, #FFFFFF)"
          stroke="var(--dg-legacy, #94A3B8)" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- the zone in front: one isolated network.
         Opaque rect first — the tint is translucent and would otherwise let the
         stacked copies behind it show through. -->
    <rect x="40" y="72" width="616" height="384" rx="8" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="40" y="72" width="616" height="384" rx="8" fill="var(--dg-accent-tint, rgba(15,118,110,.08))"
          stroke="var(--dg-accent, #0F766E)" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,4"/>
    <rect x="56" y="64" width="128" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="64" y="76" font-size="12" font-weight="500" fill="var(--dg-accent-text, #0B5651)">격리 네트워크 1개</text>

    <!-- per-zone supporting components -->
    <rect x="56" y="304" width="584" height="136" rx="8"
          fill="var(--dg-wash-1, rgba(15,23,42,.02))" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <rect x="72" y="296" width="176" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="80" y="308" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">환경마다 따로 두는 구성</text>

    <!-- arrows -->
    <line x1="208" y1="176" x2="208" y2="204" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#mp-arrow)"/>
    <line x1="496" y1="176" x2="496" y2="204" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#mp-arrow)"/>

    <!-- supervisor -->
    <rect x="72" y="120" width="552" height="56" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="72" y="120" width="552" height="56" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="96" y="152" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">Supervisor Cluster</text>
    <text x="600" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="end" fill="var(--dg-muted, #5B6879)">vSphere 8 / VKS</text>

    <!-- guest clusters -->
    <rect x="72" y="208" width="260" height="72" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="72" y="208" width="260" height="72" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="96" y="240" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">Shared 게스트 클러스터</text>
    <text x="96" y="264" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">CI/CD · 공통 컴포넌트</text>

    <rect x="364" y="208" width="260" height="72" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="364" y="208" width="260" height="72" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="388" y="240" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">Workload 게스트 클러스터</text>
    <text x="388" y="264" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">업무 애플리케이션</text>

    <!-- supporting components -->
    <rect x="72" y="336" width="168" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="72" y="336" width="168" height="64" rx="6" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="156" y="368" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Ingress</text>
    <text x="156" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">Contour · AVI</text>

    <rect x="264" y="336" width="168" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="264" y="336" width="168" height="64" rx="6" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="348" y="368" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Registry</text>
    <text x="348" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">Harbor · Trivy</text>

    <rect x="456" y="336" width="168" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="456" y="336" width="168" height="64" rx="6" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="540" y="368" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Storage</text>
    <text x="540" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">PowerStore CSI</text>

    <text x="624" y="424" font-size="12" font-weight="500" text-anchor="end" fill="var(--dg-muted, #5B6879)">인증서 · DHCP · 점프박스도 환경마다 별도</text>

    <!-- repetition and isolation -->
    <text x="712" y="140" font-size="40" font-weight="600" fill="var(--dg-accent, #0F766E)">× 7</text>
    <text x="712" y="168" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">격리 네트워크</text>
    <line x1="712" y1="192" x2="920" y2="192" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>

    <text x="712" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          fill="var(--dg-muted, #5B6879)">Supervisor 7</text>
    <text x="712" y="244" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">게스트 클러스터 18</text>
    <text x="712" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          fill="var(--dg-muted, #5B6879)">Shared 9 · Workload 9</text>
    <text x="712" y="292" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">확인된 워커 66대+</text>

    <text x="712" y="344" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">환경 간 통신 경로 없음</text>
    <text x="712" y="372" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">공유 레지스트리나 중앙</text>
    <text x="712" y="392" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">GitOps를 둘 수 없습니다.</text>
    <text x="712" y="416" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">그래서 구성을 똑같이</text>
    <text x="712" y="436" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">유지하는 쪽을 택했습니다.</text>

    <!-- legend -->
    <line x1="40" y1="488" x2="920" y2="488" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <text x="40" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">LEGEND</text>
    <rect x="136" y="508" width="32" height="16" rx="3" fill="var(--dg-accent-tint, rgba(15,118,110,.08))"
          stroke="var(--dg-accent, #0F766E)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>
    <text x="180" y="516" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">서로 통신하지 않는 경계</text>
    <rect x="392" y="504" width="28" height="16" rx="3" fill="var(--dg-surface, #FFFFFF)"
          stroke="var(--dg-legacy, #94A3B8)" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="384" y="512" width="28" height="16" rx="3" fill="var(--dg-surface, #FFFFFF)"
          stroke="var(--dg-legacy, #94A3B8)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="432" y="516" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">같은 구성이 네트워크마다 반복</text>
  </g>
</svg>

<footer>diagram-design · profile namhyeonyeo-portfolio · sanitized public version</footer>
</div>
</body>
</html>
