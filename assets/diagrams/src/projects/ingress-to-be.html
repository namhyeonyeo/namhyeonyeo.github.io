<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TO-BE — AKO / AVI 인그레스 구조</title>
<style>
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Ingress Architecture Migration</p>
<h1>TO-BE — AKO / AVI 구조</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     aria-labelledby="ingress-to-be-title ingress-to-be-desc">
  <title id="ingress-to-be-title">TO-BE 인그레스 구조 — AKO와 AVI Virtual Service</title>
  <desc id="ingress-to-be-desc">AKO가 Ingress를 읽어 AVI Controller의 Virtual Service 설정으로 옮기고, 어느 네트워크로 받을지는 IngressClass와 AviInfraSetting에서 결정됩니다. 요청은 DNS와 업무망·통제망 VIP를 지나 Kubernetes Service로 바로 전달되며, 기존 Envoy 홉은 경로에서 빠집니다.</desc>

  <defs>
    <marker id="it-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
    <marker id="it-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-muted, #5B6879)"/>
    </marker>
    <marker id="it-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-accent, #0F766E)"/>
    </marker>
  </defs>

    <text x="64" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">CONTROL PLANE</text>

    <rect x="40" y="256" width="880" height="224" rx="8"
          fill="var(--dg-wash-1, rgba(15,23,42,.02))" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <rect x="56" y="248" width="120" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="64" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">DATA PLANE</text>

    <text x="264" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">기존 이름 유지</text>

    <rect x="344" y="288" width="176" height="96" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="344" y="288" width="176" height="96" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="368" y="316" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">Virtual Service</text>
    <text x="368" y="340" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">업무망 VIP · Service Engine</text>
    <text x="368" y="364" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">통제망 VIP · Service Engine</text>

    <!-- removed hop (superseded, not accent) -->
    <rect x="544" y="304" width="96" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="544" y="304" width="96" height="64" rx="6" fill="var(--dg-legacy-fill, #F1F5F9)"

    <text x="592" y="332" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-legacy-text, #5B6879)">Envoy</text>

    <rect x="656" y="304" width="112" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>

  </g>
</svg>
