<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitOps 이관 — 관리 주체 이전</title>
<style>
  /* Standalone preview only. In the site these are defined in theme.css and the
     exported SVG inherits them, so the same file renders light, dark and print. */
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Infrastructure GitOps Migration</p>
<h1>관리 주체 이전 — 수동 반영에서 Git 기준 상태로</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     aria-labelledby="gitops-migration-title gitops-migration-desc">
  <title id="gitops-migration-title">GitOps 이관 — 같은 오브젝트를 두 경로가 관리하는 구간</title>
  <desc id="gitops-migration-desc">이전에는 운영자가 점프박스에서 Helm과 YAML을 직접 반영했고, 이후에는 운영자가 GitLab에 올린 기준 상태를 ArgoCD가 클러스터에 반영합니다. 두 경로가 같은 Kubernetes 오브젝트를 가리키는 구간이 생기며, 기존 경로는 sync 검증이 끝난 뒤 마지막에 제거했습니다.</desc>

    <marker id="gm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
  </defs>

          fill="var(--dg-wash-1, rgba(15,23,42,.02))" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>

    <rect x="40" y="272" width="640" height="160" rx="8"

    <rect x="56" y="264" width="264" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="64" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">TO-BE — GIT DESIRED STATE</text>

    <!-- arrows (before boxes) -->
    <line x1="176" y1="120" x2="204" y2="120" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#gm-arrow)"/>
    <line x1="352" y1="120" x2="380" y2="120" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#gm-arrow)"/>

    <path d="M 624,344 H 704 Q 712,344 712,336 V 272 Q 712,264 720,264 H 740"
          fill="none" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#gm-arrow)"/>

    <!-- arrow labels -->
    <rect x="560" y="96" width="88" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="604" y="108" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-accent-text, #0B5651)">마지막에 제거</text>

    <rect x="408" y="320" width="48" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>

          text-anchor="middle" letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">SYNC</text>

    <rect x="64" y="88" width="112" height="64" rx="6" fill="var(--dg-legacy-fill, #F1F5F9)" stroke="var(--dg-line, #94A3B8)" stroke-width="1"/>
    <text x="120" y="116" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">운영자</text>
    <text x="120" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"

    <rect x="208" y="88" width="144" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="208" y="88" width="144" height="64" rx="6" fill="var(--dg-legacy-fill, #F1F5F9)" stroke="var(--dg-line, #94A3B8)" stroke-width="1"/>
    <text x="280" y="116" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Jumpbox</text>
    <text x="280" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">bastion host</text>

    <rect x="384" y="88" width="160" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="384" y="88" width="160" height="64" rx="6" fill="var(--dg-legacy-fill, #F1F5F9)" stroke="var(--dg-line, #94A3B8)" stroke-width="1"/>

    <text x="464" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">manual apply</text>

    <!-- TO-BE nodes -->
    <rect x="64" y="312" width="112" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="64" y="312" width="112" height="64" rx="6" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="120" y="340" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">운영자</text>
    <text x="120" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"

    <rect x="208" y="312" width="192" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="208" y="312" width="192" height="64" rx="6" fill="var(--dg-accent-fill, #E6F2F1)" stroke="var(--dg-accent, #0F766E)" stroke-width="1.2"/>

    <text x="544" y="340" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">ArgoCD</text>
    <text x="544" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">sync / diff</text>

    <!-- shared target: the same live objects both paths manage -->
    <rect x="744" y="192" width="176" height="96" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="744" y="192" width="176" height="96" rx="6" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="768" y="228" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">Kubernetes</text>
    <text x="768" y="252" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">이미 서비스 중인</text>
    <text x="768" y="272" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">오브젝트</text>

    <!-- editorial aside -->
    <text x="64" y="468" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">소유권은 한 번에 옮기지 않았습니다. 조사 → Git 정의 → kubectl diff →</text>
    <text x="64" y="488" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">Application 연결 → sync 검증까지 끝난 뒤에 기존 경로를 지웠습니다.</text>

    <!-- legend -->
    <line x1="40" y1="508" x2="920" y2="508" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <text x="40" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"

    <rect x="136" y="524" width="32" height="16" rx="3" fill="var(--dg-legacy-fill, #F1F5F9)" stroke="var(--dg-line, #94A3B8)" stroke-width="1"/>
