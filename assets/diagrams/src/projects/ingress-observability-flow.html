<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingress Observability — HTTPProxy 지표 수집 흐름</title>
<style>
  /* Standalone preview only. In the site these are defined in theme.css and the
     exported SVG inherits them, so the same file renders light, dark and print. */
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Ingress Observability</p>
<h1>HTTPProxy 지표 수집 흐름</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img"
     aria-labelledby="ingress-observability-flow-title ingress-observability-flow-desc">
  <title id="ingress-observability-flow-title">HTTPProxy FQDN 지표 수집 흐름</title>
  <desc id="ingress-observability-flow-desc">CronJob이 kubectl과 jq로 HTTPProxy CR을 읽어 contour_httpproxy_info 지표로 바꾸고 Pushgateway로 보냅니다. 기존 Prometheus가 Pushgateway를 scrape하고, 운영자는 PromQL로 어떤 HTTPProxy가 어떤 FQDN을 받고 있는지 조회합니다. CronJob과 Pushgateway만 새로 붙였고 Prometheus 구성은 그대로 두었습니다.</desc>

  <defs>
    <marker id="iof-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
  </defs>

  <g font-family="'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif">

    <!-- zone (drawn first) -->
    <rect x="256" y="152" width="448" height="136" rx="8"
          fill="var(--dg-wash-1, rgba(15,23,42,.02))" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <rect x="272" y="144" width="184" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="280" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">ADDED ALONGSIDE</text>

    <!-- arrows (before boxes) -->
    <line x1="200" y1="224" x2="268" y2="224" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#iof-arrow)"/>
    <line x1="464" y1="224" x2="524" y2="224" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#iof-arrow)"/>
    <line x1="688" y1="224" x2="748" y2="224" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#iof-arrow)"/>
    <line x1="832" y1="256" x2="832" y2="316" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#iof-arrow)"/>

    <!-- arrow labels -->
    <rect x="204" y="200" width="64" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="236" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">READS</text>

    <rect x="472" y="200" width="48" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="496" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">PUSH</text>

    <rect x="692" y="200" width="56" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="720" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" letter-spacing="0.06em" fill="var(--dg-muted, #5B6879)">SCRAPE</text>

    <!-- nodes -->
    <rect x="40" y="192" width="160" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="40" y="192" width="160" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="120" y="220" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">HTTPProxy</text>
    <text x="120" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">custom resource</text>

    <rect x="272" y="192" width="192" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="272" y="192" width="192" height="64" rx="6" fill="var(--dg-accent-fill, #E6F2F1)" stroke="var(--dg-accent, #0F766E)" stroke-width="1.2"/>
    <text x="368" y="220" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-accent-text, #0B5651)">CronJob</text>
    <text x="368" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-accent-text, #0B5651)">kubectl + jq</text>

    <rect x="528" y="192" width="160" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="528" y="192" width="160" height="64" rx="6" fill="var(--dg-accent-fill, #E6F2F1)" stroke="var(--dg-accent, #0F766E)" stroke-width="1.2"/>
    <text x="608" y="220" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-accent-text, #0B5651)">Pushgateway</text>
    <text x="608" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-accent-text, #0B5651)">metrics/job</text>

    <rect x="752" y="192" width="160" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="752" y="192" width="160" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="832" y="220" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Prometheus</text>
    <text x="832" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">package-managed</text>

    <rect x="752" y="320" width="160" height="64" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="752" y="320" width="160" height="64" rx="6" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="832" y="348" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">PromQL 조회</text>
    <text x="832" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" fill="var(--dg-muted, #5B6879)">fqdn / status</text>

    <!-- editorial aside -->
    <text x="40" y="336" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">HTTPProxy CR을 contour_httpproxy_info 지표로 바꿔 넣었습니다.</text>
    <text x="40" y="360" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">패키지가 관리하는 Prometheus 구성은 건드리지 않았습니다.</text>

    <!-- legend -->
    <line x1="40" y1="440" x2="920" y2="440" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <text x="40" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">LEGEND</text>
    <rect x="136" y="456" width="32" height="16" rx="3" fill="var(--dg-accent-fill, #E6F2F1)" stroke="var(--dg-accent, #0F766E)" stroke-width="1.2"/>
    <text x="180" y="468" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">이번에 추가한 구성</text>
    <rect x="336" y="456" width="32" height="16" rx="3" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="380" y="468" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">기존 구성</text>
  </g>
</svg>

<footer>diagram-design · profile namhyeonyeo-portfolio · sanitized public version</footer>
</div>
</body>
</html>
