<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Cluster API 장애 — 의존 경로</title>
<style>
  /* Standalone preview only. In the site these are defined in theme.css and the
     exported SVG inherits them, so the same file renders light, dark and print. */
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-rca: #B83B35; --dg-rca-fill: #FBECEB;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Control Plane / PKI / Networking</p>
<h1>Guest Cluster API 장애 — 의존 경로</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img"
     aria-labelledby="etcd-san-mismatch-title etcd-san-mismatch-desc">
  <title id="etcd-san-mismatch-title">Guest Cluster API 장애의 의존 경로</title>
  <desc id="etcd-san-mismatch-desc">처음 관측된 증상은 Cluster API 무응답이었지만, 그 아래로 kube-apiserver, etcd clustering, etcd peer 인증서 SAN 불일치, control-plane VM 주소 변경을 거쳐 격리돼야 할 DHCP 영역이 겹친 것이 실제 원인이었습니다. 장애는 맨 아래 원인에서 맨 위 증상으로 전파됐습니다.</desc>

  <defs>
    <marker id="esm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
    <marker id="esm-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-muted, #5B6879)"/>
    </marker>
  </defs>

  <g font-family="'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif">

    <!-- arrows (before boxes) -->
    <line x1="476" y1="128" x2="476" y2="144" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#esm-arrow)"/>
    <line x1="476" y1="196" x2="476" y2="212" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#esm-arrow)"/>
    <line x1="476" y1="264" x2="476" y2="280" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#esm-arrow)"/>
    <line x1="476" y1="332" x2="476" y2="348" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#esm-arrow)"/>
    <line x1="476" y1="400" x2="476" y2="416" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#esm-arrow)"/>

    <!-- failure propagation rail (bottom cause → top symptom) -->
    <line x1="120" y1="468" x2="120" y2="104" stroke="var(--dg-muted, #5B6879)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#esm-arrow-muted)"/>
    <rect x="84" y="72" width="72" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="120" y="84" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-muted, #5B6879)">장애 전파</text>

    <!-- rank 0 — what the operator saw -->
    <rect x="200" y="80" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="200" y="80" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1.2"/>
    <text x="224" y="112" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">Cluster API 무응답</text>
    <text x="728" y="112" font-size="12" font-weight="500" text-anchor="end" fill="var(--dg-muted, #5B6879)">처음 관측된 증상</text>
    <text x="776" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">OBSERVED</text>

    <rect x="200" y="148" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="200" y="148" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="224" y="180" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">kube-apiserver 정상 동작 불가</text>
    <text x="776" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">API</text>

    <rect x="200" y="216" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="200" y="216" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="224" y="248" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">etcd clustering 실패</text>
    <text x="776" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">ETCD</text>

    <!-- decisive evidence -->
    <rect x="200" y="284" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="200" y="284" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-rca, #B83B35)" stroke-width="1.2"/>
    <text x="224" y="316" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">etcd peer 인증서 SAN 불일치</text>
    <text x="728" y="316" font-size="12" font-weight="500" text-anchor="end" fill="var(--dg-rca, #B83B35)">결정적 근거</text>
    <text x="776" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">PKI</text>

    <rect x="200" y="352" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="200" y="352" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="224" y="384" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">control-plane VM이 다른 주소를 받음</text>
    <text x="776" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">NETWORK</text>

    <!-- root cause -->
    <rect x="200" y="420" width="552" height="48" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="200" y="420" width="552" height="48" rx="6" fill="var(--dg-rca-fill, #FBECEB)" stroke="var(--dg-rca, #B83B35)" stroke-width="1.2"/>
    <text x="224" y="452" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">격리돼야 할 DHCP 영역이 겹침</text>
    <text x="728" y="452" font-size="12" font-weight="500" text-anchor="end" fill="var(--dg-rca, #B83B35)">확인된 원인</text>
    <text x="776" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">ROOT CAUSE</text>

    <!-- legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <text x="40" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">LEGEND</text>
    <line x1="136" y1="524" x2="168" y2="524" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#esm-arrow)"/>
    <text x="180" y="528" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">의존 방향</text>
    <line x1="284" y1="524" x2="316" y2="524" stroke="var(--dg-muted, #5B6879)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="328" y="528" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">장애 전파 방향</text>
    <rect x="452" y="516" width="32" height="16" rx="3" fill="var(--dg-surface, #FFFFFF)"
          stroke="var(--dg-rca, #B83B35)" stroke-width="1.2"/>
    <text x="496" y="528" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">결정적 근거</text>
    <rect x="620" y="516" width="32" height="16" rx="3" fill="var(--dg-rca-fill, #FBECEB)"
          stroke="var(--dg-rca, #B83B35)" stroke-width="1.2"/>
    <text x="664" y="528" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">확인된 원인</text>
  </g>
</svg>

</div>
</body>
</html>
