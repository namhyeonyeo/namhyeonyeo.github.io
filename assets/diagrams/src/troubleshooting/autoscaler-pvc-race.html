<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Autoscaler — PVC Binding Race 타임라인</title>
<style>
  /* Standalone preview only. In the site these are defined in theme.css and the
     exported SVG inherits them, so the same file renders light, dark and print. */
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-rca: #B83B35; --dg-rca-fill: #FBECEB;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Autoscaling / Storage RCA</p>
<h1>Cluster Autoscaler — PVC Binding Race</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     aria-labelledby="autoscaler-pvc-race-title autoscaler-pvc-race-desc">
  <title id="autoscaler-pvc-race-title">예상치 못한 Scale-out — PVC Binding Race 타임라인</title>
  <desc id="autoscaler-pvc-race-desc">백업 워크로드가 여러 Pod와 PVC를 거의 동시에 만들면서, 처음 눈에 띈 것은 Unbound 상태의 Pod였지만 Cluster Autoscaler가 scale-up 판단의 근거로 삼은 것은 PVC 바인딩이 먼저 끝난 인접 Pod였습니다. 노드가 추가된 뒤 백업이 끝나자 다시 scale-down됐습니다. 이벤트 간격은 실제 경과 시간에 비례하지 않습니다.</desc>

  <defs>
    <marker id="apr-tip" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
  </defs>

  <g font-family="'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif">

    <!-- baseline + event drops (drawn before labels) -->
    <line x1="72" y1="264" x2="888" y2="264" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#apr-tip)"/>

    <line x1="112" y1="260" x2="112" y2="224" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <line x1="176" y1="268" x2="176" y2="304" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <line x1="240" y1="256" x2="240" y2="176" stroke="var(--dg-rca, #B83B35)" stroke-width="1.2"/>
    <line x1="376" y1="268" x2="376" y2="360" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <line x1="512" y1="260" x2="512" y2="224" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <line x1="832" y1="268" x2="832" y2="304" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>

    <!-- interval note over the long gap between node add and backup end -->
    <rect x="632" y="236" width="80" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="672" y="248" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-muted, #5B6879)">백업 수행 중</text>

    <!-- events -->
    <circle cx="112" cy="264" r="4" fill="var(--dg-muted, #5B6879)"/>
    <circle cx="176" cy="264" r="4" fill="var(--dg-muted, #5B6879)"/>
    <circle cx="240" cy="264" r="6" fill="var(--dg-rca, #B83B35)"/>
    <circle cx="376" cy="264" r="4" fill="var(--dg-muted, #5B6879)"/>
    <circle cx="512" cy="264" r="4" fill="var(--dg-muted, #5B6879)"/>
    <circle cx="832" cy="264" r="4" fill="var(--dg-muted, #5B6879)"/>

    <!-- labels: above -->
    <text x="112" y="200" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">백업 워크로드 시작</text>
    <text x="112" y="216" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">Pod · PVC 다수 동시 생성</text>

    <text x="240" y="152" font-size="16" font-weight="600" fill="var(--dg-rca, #B83B35)">PVC binding 먼저 완료</text>
    <text x="240" y="168" font-size="12" font-weight="500" fill="var(--dg-rca, #B83B35)">인접 Pod · CA 판단의 근거</text>

    <text x="512" y="200" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">node 추가</text>
    <text x="512" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          fill="var(--dg-muted, #5B6879)">Cluster Autoscaler scale-up</text>

    <!-- labels: below -->
    <text x="176" y="324" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">Pending Pod 관측</text>
    <text x="176" y="340" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">PVC Unbound 상태</text>

    <text x="376" y="380" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">CA scale-up 판단</text>
    <text x="376" y="396" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">인접 Pod를 근거로 노드 추가 결정</text>

    <text x="832" y="324" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">scale-down</text>
    <text x="832" y="340" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-muted, #5B6879)">백업 종료 후 노드 회수</text>

    <!-- editorial aside -->
    <text x="40" y="432" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">처음 눈에 띈 것은 Unbound 상태의 Pod였지만, CA 로그와 PVC binding 시각을 같은</text>
    <text x="40" y="452" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">타임라인에 놓고 보니 scale-up의 근거는 먼저 바인딩된 인접 Pod였습니다.</text>

    <text x="40" y="480" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">조치 · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">volumeBindingMode: Immediate → WaitForFirstConsumer</tspan> 로 변경하고 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">new-pod-scale-up-delay</tspan> 를 적용했습니다.</text>
    <text x="40" y="500" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">이벤트 간격은 순서를 보여주기 위한 것으로, 실제 경과 시간에 비례하지 않습니다.</text>

    <!-- legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <text x="40" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">LEGEND</text>
    <circle cx="144" cy="544" r="6" fill="var(--dg-rca, #B83B35)"/>
    <text x="160" y="548" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">실제 scale-up 판단의 근거</text>
    <circle cx="392" cy="544" r="4" fill="var(--dg-muted, #5B6879)"/>
    <text x="408" y="548" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">관측된 이벤트</text>
  </g>
</svg>

<footer>diagram-design · profile namhyeonyeo-portfolio · sanitized public version</footer>
</div>
</body>
</html>
