<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node Provisioning 의존 경로 — PV Attach</title>
<style>
  /* Standalone preview only. In the site these are defined in theme.css and the
     exported SVG inherits them, so the same file renders light, dark and print. */
  :root {
    --dg-surface: #FFFFFF; --dg-surface-2: #F1F5F9; --dg-border: #CBD5E1;
    --dg-text: #0F172A; --dg-muted: #5B6879; --dg-line: #7C8CA0;
    --dg-accent: #0F766E; --dg-accent-fill: #E6F2F1; --dg-accent-text: #0B5651;
    --dg-legacy: #8494A6; --dg-legacy-text: #5B6879; --dg-legacy-fill: #F1F5F9;
    --dg-rca: #B83B35; --dg-rca-fill: #FBECEB;
    --dg-wash-1: rgba(15,23,42,.02); --dg-rule-wash: rgba(15,23,42,.10);
    --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 40px; background: #F8FAFC; font-family: var(--sans); color: var(--dg-text); }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dg-muted); margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 24px; }
  svg { width: 100%; height: auto; }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--dg-rule-wash); font-family: var(--mono); font-size: 12px; color: var(--dg-muted); }
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Storage / CSI / Node Provisioning</p>
<h1>Node Provisioning 의존 경로</h1>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img"
     aria-labelledby="pv-attachment-provisioning-title pv-attachment-provisioning-desc">
  <title id="pv-attachment-provisioning-title">PV attach가 막은 node provisioning 의존 경로</title>
  <desc id="pv-attachment-provisioning-desc">Machine provisioning에서 CSI attach, 볼륨 사용 가능, node/runtime 초기화를 거쳐 node Ready에 이르는 provisioning 의존 경로입니다. 운영자가 처음 본 것은 마지막 단계인 node provisioning 미완료였지만, 실제로 멈춘 지점은 두 번째 단계인 CSI attach였습니다.</desc>

  <defs>
    <marker id="pva-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-line, #94A3B8)"/>
    </marker>
    <marker id="pva-arrow-rca" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--dg-rca, #B83B35)"/>
    </marker>
  </defs>

  <g font-family="'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif">

    <!-- arrows (before boxes) -->
    <line x1="200" y1="240" x2="216" y2="240" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#pva-arrow)"/>
    <line x1="380" y1="240" x2="396" y2="240" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#pva-arrow)"/>
    <line x1="560" y1="240" x2="576" y2="240" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#pva-arrow)"/>
    <line x1="740" y1="240" x2="756" y2="240" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#pva-arrow)"/>

    <!-- the last step is where the operator noticed the failure -->
    <line x1="840" y1="200" x2="840" y2="140" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#pva-arrow)"/>
    <rect x="712" y="152" width="116" height="16" rx="2" fill="var(--dg-surface, #FFFFFF)"/>
    <text x="828" y="164" font-size="12" font-weight="500" text-anchor="end" fill="var(--dg-muted, #5B6879)">여기서 관측됨</text>

    <!-- observed symptom -->
    <rect x="520" y="56" width="400" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="520" y="56" width="400" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1.2"/>
    <rect x="536" y="68" width="88" height="16" rx="2" fill="none" stroke="var(--dg-muted, #5B6879)" stroke-width="0.8"/>
    <text x="580" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          text-anchor="middle" letter-spacing="0.08em" fill="var(--dg-muted, #5B6879)">OBSERVED</text>
    <text x="536" y="108" font-size="16" font-weight="600" fill="var(--dg-text, #0F172A)">신규 worker node provisioning 미완료</text>
    <text x="536" y="128" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">Cluster Autoscaler 검증 중 · rolling replacement도 같은 구조</text>

    <!-- provisioning dependency path -->
    <rect x="40" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="40" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="120" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Machine</text>
    <text x="120" y="260" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">provisioning</text>

    <rect x="220" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="220" y="200" width="160" height="80" rx="6" fill="var(--dg-rca-fill, #FBECEB)" stroke="var(--dg-rca, #B83B35)" stroke-width="1.2"/>
    <text x="300" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">CSI attach</text>
    <text x="300" y="260" font-size="12" font-weight="500" text-anchor="middle" fill="var(--dg-rca, #B83B35)">여기서 실패</text>

    <rect x="400" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="400" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="480" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">볼륨</text>
    <text x="480" y="260" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">사용 가능</text>

    <rect x="580" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="580" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-text, #0F172A)" stroke-width="1"/>
    <text x="660" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">node/runtime</text>
    <text x="660" y="260" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">초기화</text>

    <rect x="760" y="200" width="160" height="80" rx="6" fill="var(--dg-surface, #FFFFFF)"/>
    <rect x="760" y="200" width="160" height="80" rx="6" fill="var(--dg-surface-2, #F1F5F9)" stroke="var(--dg-muted, #5B6879)" stroke-width="1"/>
    <text x="840" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">node</text>
    <text x="840" y="260" font-size="16" font-weight="600" text-anchor="middle" fill="var(--dg-text, #0F172A)">Ready</text>

    <!-- why this path is the critical path -->
    <text x="40" y="340" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">node 설계상 persistent storage가 node/runtime 부트스트랩 경로에 마운트되어,</text>
    <text x="40" y="364" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">volume attach가 machine readiness의 critical path에 있었습니다.</text>

    <text x="40" y="412" font-size="16" font-style="italic" fill="var(--dg-rca, #B83B35)">확인된 원인 ·</text>
    <text x="160" y="412" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">벤더가 확인한 vCenter 8.0.3 계열의 attach 오판(resource-in-use).</text>
    <text x="160" y="436" font-size="16" font-style="italic" fill="var(--dg-muted, #5B6879)">임시 조치는 CSI controller 재시작, 이후 수정 포함 업데이트 라인으로 올렸습니다.</text>

    <!-- legend -->
    <line x1="40" y1="468" x2="920" y2="468" stroke="var(--dg-rule-wash, rgba(15,23,42,.10))" stroke-width="0.8"/>
    <text x="40" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="0.14em" fill="var(--dg-muted, #5B6879)">LEGEND</text>
    <line x1="136" y1="492" x2="168" y2="492" stroke="var(--dg-line, #94A3B8)" stroke-width="1.2" marker-end="url(#pva-arrow)"/>
    <text x="180" y="496" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">provisioning 의존 경로</text>
    <rect x="360" y="484" width="32" height="16" rx="3" fill="var(--dg-rca-fill, #FBECEB)"
          stroke="var(--dg-rca, #B83B35)" stroke-width="1.2"/>
    <text x="404" y="496" font-size="12" font-weight="500" fill="var(--dg-muted, #5B6879)">실제로 멈춘 단계</text>
  </g>
</svg>

<footer>diagram-design · profile namhyeonyeo-portfolio · sanitized public version</footer>
</div>
</body>
</html>
