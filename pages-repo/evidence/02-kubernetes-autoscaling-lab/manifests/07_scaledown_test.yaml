# ============================================================
# 07_scaledown_test.yaml
# 목적: CA 스케일다운 동작 검증 (노드 제거 시나리오)
# 원리: CA는 기본 10분간 노드가 50% 미만 사용률이면 스케일다운 후보로 지정
#       safe-to-evict annotation, PDB, non-evictable Pod 등이 방해 요소
#
# 적용: kubectl apply -f 07_scaledown_test.yaml
# ============================================================

---
# [시나리오 1] CA 스케일다운 방해 요소 테스트
# safe-to-evict: false → CA가 이 Pod이 있는 노드를 제거하지 못함
apiVersion: v1
kind: Pod
metadata:
  name: ca-block-pod
  namespace: autoscale-test
  labels:
    app: ca-block
    test-type: scaledown-block
  annotations:
    # 이 annotation이 있으면 CA가 노드를 제거하지 않음
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  restartPolicy: Always

---
# [시나리오 2] CA 스케일다운 허용 Pod (safe-to-evict: true)
apiVersion: v1
kind: Pod
metadata:
  name: ca-evictable-pod
  namespace: autoscale-test
  labels:
    app: ca-evictable
    test-type: scaledown-allow
  annotations:
    # 명시적으로 evict 허용 (StatefulSet, local storage 없는 경우 기본 허용)
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
spec:
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  restartPolicy: Always

---
# [시나리오 3] emptyDir 볼륨 사용 Pod → CA 스케일다운 기본적으로 차단
# CA는 emptyDir 사용 Pod을 기본으로 evict하지 않음 (데이터 손실 위험)
# --skip-nodes-with-local-storage=false 옵션 필요
apiVersion: v1
kind: Pod
metadata:
  name: ca-localdata-pod
  namespace: autoscale-test
  labels:
    app: ca-localdata
    test-type: scaledown-localdata
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumeMounts:
    - name: local-data
      mountPath: /data
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  volumes:
  - name: local-data
    emptyDir: {}

---
# [시나리오 4] 스케일다운 후 재배치 테스트
# 부하를 제거하고 일정 시간 후 CA가 빈 노드를 제거하는지 확인
# 부하 제거: kubectl delete job load-heavy -n autoscale-test
# 관찰: kubectl get nodes -w (노드가 줄어드는 데 기본 10분 소요)
#
# CA scaledown 관련 주요 플래그 (CA Deployment args에 설정):
# --scale-down-enabled=true
# --scale-down-delay-after-add=10m      (노드 추가 후 최소 10분 대기)
# --scale-down-unneeded-time=10m        (불필요 노드 10분 지속 시 제거)
# --scale-down-utilization-threshold=0.5  (50% 미만 사용률 노드 제거 후보)
# --max-node-provision-time=15m         (노드 프로비저닝 최대 대기 시간)

---
# ──────────────────────────────────────────
# 스케일다운 테스트 절차:
#
# 1) 부하 제거:
#    kubectl delete job load-light load-heavy load-extreme -n autoscale-test
#
# 2) HPA 스케일다운 관찰:
#    watch -n 10 kubectl get hpa -n autoscale-test
#    watch -n 10 kubectl get pods -n autoscale-test | wc -l
#
# 3) CA 스케일다운 후보 노드 확인:
#    kubectl logs -n kube-system -l app=cluster-autoscaler -f | \
#      grep -E "scale_down|scaleDown|scale down|unneeded"
#
# 4) 노드 Drain 전 이벤트 확인:
#    kubectl get events -n kube-system | grep -E "Drain|Evict|ScaleDown"
#
# 5) 스케일다운 블로커 진단:
#    kubectl get cm -n kube-system cluster-autoscaler-status -o yaml | \
#      grep -A20 "scaleDown"
#
# 6) safe-to-evict 블로커 Pod 찾기:
#    kubectl get pods -A -o json | \
#      jq '.items[] | select(.metadata.annotations["cluster-autoscaler.kubernetes.io/safe-to-evict"] == "false") | .metadata.name'
# ──────────────────────────────────────────
